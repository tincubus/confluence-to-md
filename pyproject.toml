[project]
name = "confluence-to-md"
version = "0.1.0"
description = "Export Confluence Pages into an offline markdown Vault"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
confluence-to-md = "confluence_to_md.cli:console"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/confluence_to_md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
